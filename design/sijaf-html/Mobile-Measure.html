<!doctype html>

<body>
<!-- شاشة: موبايل · المقاسات · مقاس التصميم 390×844 -->
<div dir="rtl" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--canvas); font-family: var(--font-sans); color: var(--ink-2); overflow: hidden">
<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">

<svg class="ns-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16"></path><path d="M6 4v16"></path><path d="M18 4v16"></path><path d="M6 4c0 6 3 10 5 16"></path><path d="M18 4c0 6-3 10-5 16"></path></svg>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="ns-field"><span class="ns-field__label">العرض (سم)</span><div class="ns-num"><input type="number" inputmode="numeric" aria-label="العرض (سم)" value="300"><button type="button" aria-label="زيادة"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button></div></div>
<div class="ns-field"><span class="ns-field__label">الارتفاع (سم)</span><div class="ns-num"><input type="number" inputmode="numeric" aria-label="الارتفاع (سم)" value="260"><button type="button" aria-label="زيادة"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button></div></div>
</div>
</section>
<section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 17px; line-height: 26px; font-weight: 700; color: var(--ink); font-size: 15px">نتيجة التحليل</h2><span style="font-size: 12px; line-height: 18px; color: var(--ink-muted)">اضغط على أي بند لتغييره</span></div>

-2 6-2 3 2 4 2"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--ink-muted)">الشيفون</span><span style="font-size: 14px; font-weight: 600; color: var(--ink)">شيفون لينين</span></span><span style="font-size: 12px; font-weight: 600; color: var(--ink-2)">92%</span><span style="color: var(--ink-muted)"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></span></button><button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--primary); background: var(--primary-soft); border-radius: var(--radius-md); font-family: var(--font-sans); text-align: start; cursor: pointer"><span style="color: var(--ink-muted)"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5c3 0 3 2 6 2s3-2 6-2 3 2 4 2"></path><path d="M4 11c3 0 3 2 6 2s3-2 6-2 3 2 4 2"></path><path d="M4 17c3 0 3 2 6 2s3-2 6-2 3 2 4 2"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--ink-muted)">القماش الأساسي</span><span style="font-size: 14px; font-weight: 600; color: var(--ink)">قطيفة تركي</span></span><span style="font-size: 12px; font-weight: 600; color: var(--primary)">عدّلتها</span><span style="color: var(--ink-muted)"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></span></button><button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-md); font-family: var(--font-sans); text-align: start; cursor: pointer"><span style="color: var(--ink-muted)"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4z"></path><path d="M4 12l8 4 8-4"></path><path d="M4 16l8 4 8-4"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--ink-muted)">البطانة</span><span style="font-size: 14px; font-weight: 600; color: var(--ink)">بطانة</span></span><span style="font-size: 12px; font-weight: 600; color: var(--ink-2)">85%</span><span style="color: var(--ink-muted)"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></span></button></div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); background: transparent; color: var(--primary); font: 600 14px/22px var(--font-sans); cursor: pointer"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>إضافة بند</button>

</div>
</div>
