<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض سعر جديد — موبايل · سِجاف</title>
<link rel="stylesheet" href="assets/sijaf.css">
</head>
<body>
<!-- شاشة: عرض سعر جديد · موبايل · مقاس التصميم 390×844 -->
<div dir="rtl" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--canvas); font-family: var(--font-sans); color: var(--ink-2); overflow: hidden">
<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><a href="Mobile-Home.html" aria-label="رجوع" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); flex: none"><svg class="ns-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700; color: var(--ink)">عرض سعر جديد</span><span style="font-size: 12px; line-height: 18px; color: var(--ink-muted)">خطوة 1 من 4</span></div></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 4px; border-radius: 999px; background: var(--primary)"></span><span style="height: 4px; border-radius: 999px; background: var(--border)"></span><span style="height: 4px; border-radius: 999px; background: var(--border)"></span><span style="height: 4px; border-radius: 999px; background: var(--border)"></span></div>
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink-2)">اسم العميل<input type="text" placeholder="مثال: أحمد محمد" style="height: 40px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); padding: 0 12px; font: 400 14px/22px var(--font-sans); color: var(--ink); width: 100%; height: 48px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink-2)">رقم الموبايل (واتساب)<input type="tel" placeholder="01xxxxxxxxx" dir="ltr" style="height: 40px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); padding: 0 12px; font: 400 14px/22px var(--font-sans); color: var(--ink); width: 100%; height: 48px; text-align: right"></label>
</div>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 200px; border: 1.5px dashed var(--primary); border-radius: var(--radius-lg); background: var(--primary-soft); color: var(--primary); font-family: var(--font-sans); cursor: pointer">
<span style="width: 64px; height: 64px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center"><svg class="ns-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3.2l1.8-3h6l1.8 3H20v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
<span style="font-size: 17px; font-weight: 700">صوّر الستارة</span>
<span style="font-size: 12px; color: var(--ink-2)">الشباك كله من الأرض للسقف</span>
</button>
<a href="#" class="ns-btn ns-btn--secondary" style="text-decoration: none; height: 48px">اختار من الصور <svg class="ns-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h8"></path><path d="M4 16l4.5-4.5 4 4 2.5-2.5L20 18"></path><path d="M18 3v6"></path><path d="M15 6h6"></path></svg></a>
<div class="ns-note" role="note"><svg class="ns-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg><div>الذكاء الاصطناعي هيحدد الموديل والخامات، وتقدر تعدّل أي حاجة بعدها.</div></div>
</div>
<div style="padding: 12px 16px 24px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px"><a href="Mobile-Measure.html" class="ns-btn ns-btn--primary" style="text-decoration: none; height: 52px; font-size: 15px; flex: 1">متابعة <svg class="ns-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a></div>
</div>
</body>
</html>
